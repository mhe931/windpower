[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windpower"
version = "0.1.0"
description = "Reproducible Finland wind-power baseline (ERA5 + fleet inventory + atlite) with offline synthetic fixtures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "xarray>=2024.6",
    "netCDF4>=1.7",
    "h5netcdf>=1.3",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=16",
    "requests>=2.31",
    "atlite>=0.4",
    "cdsapi>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
